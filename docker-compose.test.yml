version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: agri-mysql-test
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agri_platform
    networks:
      - test-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: agri-redis-test
    ports:
      - "6380:6379"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
