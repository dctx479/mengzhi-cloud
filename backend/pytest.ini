[pytest]
# Pytest配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=app
    --cov-report=html:coverage_html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --ignore=tests/e2e/test_complete_flow.py

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    auth: 认证测试
    product: 产品测试
    chat: 对话测试
    models: 模型测试

# 日志配置
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# 超时配置
timeout = 300
timeout_method = thread

# 忽略的文件
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
