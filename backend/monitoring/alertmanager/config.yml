# Alertmanager配置 - 生产就绪版本

global:
  resolve_timeout: 5m
  # SMTP配置（需要根据实际情况修改）
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'alertmanager@example.com'
  # smtp_auth_password: 'your_password_here'
  # smtp_require_tls: true

# 模板
templates:
  - '/etc/alertmanager/*.tmpl'

# 路由配置
route:
  group_by: ['alertname', 'cluster', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  receiver: 'default'

  routes:
    # 严重告警 - 立即处理
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      continue: true

    # 警告告警
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 12h

    # 信息告警
    - match:
        severity: info
      receiver: 'info-alerts'
      repeat_interval: 24h

# 接收器配置
receivers:
  # 默认接收器 - Webhook到后端API
  - name: 'default'
    webhook_configs:
      - url: 'http://ai-platform-backend:8000/api/v1/webhooks/alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'alertmanager_webhook_secret'

  # 严重告警接收器
  - name: 'critical-alerts'
    # Webhook通知
    webhook_configs:
      - url: 'http://ai-platform-backend:8000/api/v1/webhooks/critical-alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'alertmanager_webhook_secret'

    # 邮件通知（可选，需要配置SMTP）
    # email_configs:
    #   - to: 'admin@example.com'
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    #     html: |
    #       <h2>严重告警</h2>
    #       <p><strong>告警名称:</strong> {{ .GroupLabels.alertname }}</p>
    #       <p><strong>告警级别:</strong> {{ .CommonLabels.severity }}</p>
    #       <p><strong>告警描述:</strong> {{ .CommonAnnotations.description }}</p>
    #       <p><strong>告警时间:</strong> {{ .StartsAt }}</p>

    # Slack通知（可选，需要Slack Webhook URL）
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#critical-alerts'
    #     title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: |
    #       {{ .CommonAnnotations.description }}
    #       Status: {{ .Status }}
    #       Severity: {{ .CommonLabels.severity }}
    #     send_resolved: true

  # 警告告警接收器
  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://ai-platform-backend:8000/api/v1/webhooks/warning-alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'alertmanager_webhook_secret'

  # 信息告警接收器
  - name: 'info-alerts'
    webhook_configs:
      - url: 'http://ai-platform-backend:8000/api/v1/webhooks/info-alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'alertmanager_webhook_secret'

# 抑制规则 - 避免告警风暴
inhibit_rules:
  # 严重告警会抑制同一告警的警告级别
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'instance']

  # 严重告警会抑制同一告警的信息级别
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'instance']

  # 警告告警会抑制同一告警的信息级别
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'instance']

  # 服务不可用会抑制该服务的所有其他告警
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['job', 'instance']
