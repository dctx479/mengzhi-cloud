# 性能优化配置
# 版本: 1.0

## 数据库优化
database_optimization:
  # 索引优化
  indexes:
    - table: users
      columns: [email, phone, enterprise_id]
    - table: tenant_ai_configs
      columns: [enterprise_id, provider, is_active]
    - table: quota_usage
      columns: [quota_id, used_at, operation]
    - table: audit_logs
      columns: [user_id, action, created_at]

  # 连接池配置
  connection_pool:
    pool_size: 20
    max_overflow: 10
    pool_timeout: 30
    pool_recycle: 3600

  # 查询缓存
  query_cache:
    enabled: true
    ttl: 300  # 5分钟

## API优化
api_optimization:
  # Redis缓存
  redis:
    host: localhost
    port: 6379
    db: 0
    ttl: 600  # 10分钟

  # 响应压缩
  compression:
    enabled: true
    min_size: 1024  # 1KB

  # 限流
  rate_limiting:
    enabled: true
    requests_per_minute: 100

## 前端优化
frontend_optimization:
  # 代码分割
  code_splitting:
    enabled: true
    chunk_size: 500  # KB

  # 懒加载
  lazy_loading:
    routes: true
    components: true
    images: true

  # 资源压缩
  compression:
    js: true
    css: true
    images: true

  # CDN配置
  cdn:
    enabled: false
    url: https://cdn.example.com
