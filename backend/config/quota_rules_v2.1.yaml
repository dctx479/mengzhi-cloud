# 配额和计费规则配置（完整版）
# 版本: 2.1
# 日期: 2026-01-22
# 说明: 支持对话Token、图片、视频（按秒/按帧）计费

# ==================== 配额层级 ====================
quota_tiers:
  free_tier:
    name: "免费版"
    price: 0
    limits:
      # 对话Token配额
      monthly_tokens: 10000
      daily_tokens: 500

      # 图片生成配额
      monthly_images: 10
      daily_images: 2

      # 视频生成配额（秒）
      monthly_video_seconds: 0
      daily_video_seconds: 0

      # 视频生成配额（帧）
      monthly_video_frames: 0
      daily_video_frames: 0

      # 并发限制
      max_concurrent_requests: 1
      max_requests_per_minute: 10

    features:
      - basic_chat
      - image_generation_512

  basic_tier:
    name: "基础版"
    price: 99
    limits:
      monthly_tokens: 100000
      daily_tokens: 5000
      monthly_images: 100
      daily_images: 20
      monthly_video_seconds: 60
      daily_video_seconds: 10
      monthly_video_frames: 1800  # 60秒 * 30fps
      daily_video_frames: 300     # 10秒 * 30fps
      max_concurrent_requests: 3
      max_requests_per_minute: 30

    features:
      - basic_chat
      - advanced_chat
      - image_generation_1024
      - video_generation_720p

  professional_tier:
    name: "专业版"
    price: 999
    limits:
      monthly_tokens: 1000000
      daily_tokens: 50000
      monthly_images: 1000
      daily_images: 200
      monthly_video_seconds: 600
      daily_video_seconds: 100
      monthly_video_frames: 18000  # 600秒 * 30fps
      daily_video_frames: 3000     # 100秒 * 30fps
      max_concurrent_requests: 10
      max_requests_per_minute: 100

    features:
      - basic_chat
      - advanced_chat
      - image_generation_2048
      - video_generation_1080p
      - priority_support

  enterprise_tier:
    name: "企业版"
    price: 9999
    limits:
      monthly_tokens: -1
      daily_tokens: -1
      monthly_images: -1
      daily_images: -1
      monthly_video_seconds: -1
      daily_video_seconds: -1
      monthly_video_frames: -1
      daily_video_frames: -1
      max_concurrent_requests: 50
      max_requests_per_minute: 500

    features:
      - all

# ==================== 计费规则 ====================
billing_rules:
  # AI对话计费（按Token）
  chat_pricing:
    deepseek:
      input_token: 0.0001   # ¥0.0001/token
      output_token: 0.0002
    openai_gpt4:
      input_token: 0.001
      output_token: 0.002
    openai_gpt35:
      input_token: 0.0001
      output_token: 0.0002

  # 即梦图片生成计费（按张数和分辨率）
  jimeng_image_pricing:
    "512x512":
      price: 0.1
      quota_cost: 1
    "1024x1024":
      price: 0.3
      quota_cost: 3
    "2048x2048":
      price: 0.8
      quota_cost: 8

  # 即梦视频生成计费（按秒数）
  jimeng_video_pricing_by_second:
    "720p":
      price_per_second: 0.5
      quota_cost_per_second: 1
    "1080p":
      price_per_second: 1.0
      quota_cost_per_second: 2
    "4k":
      price_per_second: 3.0
      quota_cost_per_second: 5

  # 即梦视频生成计费（按帧数）
  # 参考：即梦官方文档，字节跳动视频生成API
  jimeng_video_pricing_by_frame:
    "720p_24fps":
      price_per_frame: 0.02    # ¥0.02/帧
      quota_cost_per_frame: 1   # 每帧消耗1帧配额
      fps: 24
    "720p_30fps":
      price_per_frame: 0.017   # ¥0.017/帧（30fps略便宜）
      quota_cost_per_frame: 1
      fps: 30
    "1080p_24fps":
      price_per_frame: 0.04
      quota_cost_per_frame: 2
      fps: 24
    "1080p_30fps":
      price_per_frame: 0.033
      quota_cost_per_frame: 2
      fps: 30
    "4k_24fps":
      price_per_frame: 0.12
      quota_cost_per_frame: 5
      fps: 24
    "4k_30fps":
      price_per_frame: 0.1
      quota_cost_per_frame: 5
      fps: 30

  # 失败处理计费
  failure_handling:
    image_generation_failed:
      refund_percentage: 100
    video_generation_failed:
      refund_percentage: 100
    video_generation_partial:
      refund_percentage: 0

  # 超额计费（上浮50%）
  overage_pricing:
    token_overage_multiplier: 1.5
    image_overage_multiplier: 1.5
    video_overage_multiplier: 1.5

# ==================== 成本控制 ====================
cost_control:
  single_request_limits:
    max_image_cost: 10.0
    max_video_cost: 100.0
    max_video_duration: 300
    max_video_frames: 9000  # 300秒 * 30fps

  daily_spending_limits:
    free_tier: 0
    basic_tier: 50
    professional_tier: 500
    enterprise_tier: -1

  alert_thresholds:
    daily_spending_warning: 0.8
    daily_spending_critical: 0.95
    unusual_spike: 5.0

# ==================== 计费严谨性保障 ====================
billing_integrity:
  pre_deduction:
    enabled: true
    timeout_seconds: 300

  idempotency:
    enabled: true
    key_ttl_seconds: 3600

  audit:
    enabled: true
    log_all_transactions: true
    retention_days: 365

  validation:
    check_quota_before_request: true
    check_balance_before_request: true
    double_check_after_deduction: true

# ==================== 配额重置规则 ====================
reset_rules:
  monthly: "0 0 1 * *"
  daily: "0 0 * * *"

# ==================== 预警阈值 ====================
alert_thresholds:
  quota_warning: 0.8
  quota_critical: 0.95
  balance_low: 10.0
