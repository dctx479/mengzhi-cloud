"""
Prompt模板配置文件 (YAML格式)

定义：
- 模板分类和元数据
- 文化元素库
- 目标受众模型
- 风格配置

版本: 2.0
更新日期: 2026-01-17
"""

# ==================== 模板配置 ====================

templates:
  # 产品文案生成
  product_copy:
    description: "产品文案生成模板"
    category: "content_generation"
    variants:
      professional:
        name: "专业权威风格"
        description: "适合高端市场、官方渠道、权威背书"
        target_audience: "企业采购、高端消费者、专业人士"
        use_cases:
          - 官方网站产品介绍
          - B2B营销文案
          - 产品手册和白皮书
          - 媒体宣传稿
        characteristics:
          - 学术严谨
          - 数据支撑
          - 权威背书
          - 专业术语
        tone: "权威、专业、可信"
        recommended_length: "300-500"

      casual:
        name: "亲切友好风格"
        description: "强调真实感和代入感，适合社交媒体"
        target_audience: "普通消费者、社交媒体粉丝"
        use_cases:
          - 小红书笔记
          - 微博推文
          - 公众号文章
          - 社区分享
        characteristics:
          - 口语化
          - 生活场景
          - 真实感强
          - 代入感足
        tone: "亲切、友好、真诚"
        recommended_length: "200-300"

      emotional:
        name: "情感共鸣风格"
        description: "通过故事化叙述建立品牌连接"
        target_audience: "消费者、品牌粉丝、内容消费者"
        use_cases:
          - 品牌故事传播
          - 内容营销文案
          - 品牌推文和文章
          - 纪录片脚本
        characteristics:
          - 故事化
          - 细节刻画
          - 情感丰富
          - 触发共鸣
        tone: "温暖、感人、有温度"
        recommended_length: "400-600"

      creative:
        name: "创意新颖风格"
        description: "打破常规表达，突出独特性"
        target_audience: "年轻消费者、创意爱好者、社交媒体用户"
        use_cases:
          - 抖音文案
          - 创意广告
          - 品牌事件文案
          - 社交媒体话题
        characteristics:
          - 创意十足
          - 反常规
          - 比喻拟人
          - 记忆点强
        tone: "新颖、独特、吸睛"
        recommended_length: "150-300"

  # 广告语生成
  slogan:
    description: "广告语生成模板"
    category: "content_generation"
    output_format:
      type: "list"
      item_length: "8-15 characters"
      count: "typically 5-10"
    styles:
      classic:
        name: "古典风格"
        characteristics: ["四字对仗", "文化底蕴", "气势恢宏"]
        examples: ["地理标志，品质保证", "草原承诺，品质如一"]

      modern:
        name: "现代风格"
        characteristics: ["简洁有力", "时尚感", "生活方式"]
        examples: ["无添加，更放心", "品质生活，从这里开始"]

      cultural:
        name: "文化融合风格"
        characteristics: ["内蒙古元素", "民族特色", "故事性强"]
        examples: ["草原故事，品质讲述", "游牧传统，现代品质"]

      emotional:
        name: "情感风格"
        characteristics: ["触发情感", "人文关怀", "价值观共鸣"]
        examples: ["品质信任，代代传承", "健康陪伴，品质相伴"]

  # 社交媒体文案
  social_media:
    xiaohongshu:
      name: "小红书种草笔记"
      description: "强调真实体验、社区气氛、种草效应"
      characteristics:
        - 真实感强
        - 细节丰富
        - 表情符号
        - 社区互动
      recommended_length: "600-800 characters"
      format: "【标题】正文【标签】"

    douyin:
      name: "抖音短视频文案"
      description: "快速吸引、节奏感强、高传播力"
      characteristics:
        - 钩子强
        - 节奏快
        - 冲击力
        - 易转发
      recommended_length: "短视频配文"

    weibo:
      name: "微博话题文案"
      description: "话题驱动、互动性强、传播效应快"
      characteristics:
        - 话题性
        - 讨论性
        - 传播力
        - 实时性

    wechat:
      name: "微信公众号文案"
      description: "深度内容、用户价值、粉丝运营"
      characteristics:
        - 深度思考
        - 提供价值
        - 专业度
        - 粉丝粘性

  # 短视频脚本
  short_video_script:
    name: "短视频脚本"
    description: "完整的视频脚本，包括画面、文案、音效等"
    lengths:
      15: "15秒 - 快速种草"
      30: "30秒 - 标准宣传"
      60: "60秒 - 完整故事"
      120: "120秒 - 深度讲述"

  # 营销方案
  marketing_strategy:
    name: "完整营销方案"
    description: "从战略到执行的完整营销方案"
    sections:
      - 营销目标 (3-5个SMART目标)
      - 目标受众画像
      - 核心营销策略 (3-5个)
      - 营销活动计划 (3-5个活动)
      - 内容规划 (发布日历)
      - 执行时间表
      - 效果评估体系
      - 预算分配
      - 风险管理
      - 成功案例参考


