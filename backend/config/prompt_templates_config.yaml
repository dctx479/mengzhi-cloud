# ==================== 目标受众模型 ====================

audience_segments:
  high_end_consumer:
    name: "高端消费者"
    age_range: "30-55岁"
    income: "年收入50万+"
    education: "本科及以上"
    characteristics:
      - 注重品质和品牌
      - 关注产品来源和工艺
      - 愿意为品质付费
      - 追求生活品味
    pain_points:
      - 无法有效鉴别产品品质
      - 信息获取渠道有限
      - 担心购买到假冒伪劣
    desires:
      - 获得认可和满足感
      - 展示品味和地位
      - 健康和长寿
    recommended_styles:
      - professional
      - emotional
    recommended_platforms:
      - 官方网站
      - 微信公众号
      - 微博

  young_professionals:
    name: "年轻职业人"
    age_range: "25-40岁"
    income: "年收入30-100万"
    education: "本科及以上"
    characteristics:
      - 快节奏生活
      - 重视效率和品质
      - 活跃于社交媒体
      - 容易接受新事物
    pain_points:
      - 时间有限，信息过载
      - 难以判断产品真伪
      - 寻求生活品质提升
    desires:
      - 便利和品质的平衡
      - 社交分享和赞誉
      - 健康和效率
    recommended_styles:
      - casual
      - creative
    recommended_platforms:
      - 小红书
      - 抖音
      - 微博

  family_consumers:
    name: "家庭消费者"
    age_range: "35-60岁"
    income: "年收入20-80万"
    education: "中专及以上"
    characteristics:
      - 重视家庭健康
      - 价格敏感度中等
      - 信任口碑和背书
      - 追求实用性
    pain_points:
      - 担心食品安全
      - 怕被欺骗
      - 追求性价比
    desires:
      - 家人健康
      - 生活品质
      - 物有所值
    recommended_styles:
      - professional
      - casual
    recommended_platforms:
      - 微信
      - 微博
      - 电商平台

  food_lovers:
    name: "美食爱好者"
    age_range: "20-45岁"
    income: "年收入15-80万"
    education: "各种"
    characteristics:
      - 对美食有深度了解
      - 愿意尝试新产品
      - 乐于分享美食体验
      - 对工艺有认知
    pain_points:
      - 难以找到真正优质产品
      - 信息真伪难辨
      - 价格可能较高
    desires:
      - 发现独特美食
      - 分享和获得认可
      - 品尝不同风味
    recommended_styles:
      - casual
      - emotional
      - creative
    recommended_platforms:
      - 小红书
      - 抖音
      - 微博


# ==================== 风格配置 ====================

style_guidelines:
  professional:
    tone: "权威、专业、可信"
    language_level: "书面语，学术严谨"
    sentence_structure: "复杂句式，逻辑清晰"
    vocabulary: "专业术语，学科词汇"
    do:
      - 使用数据和统计
      - 强调认证和背书
      - 详细说明技术参数
      - 引用权威来源
    dont:
      - 过度感情化
      - 使用流行语
      - 不实承诺
      - 夸大其词

  casual:
    tone: "亲切、友好、真诚"
    language_level: "口语，易读"
    sentence_structure: "短句为主，节奏轻快"
    vocabulary: "日常用词"
    do:
      - 使用第一人称
      - 分享真实经历
      - 细节描写
      - 表达真实感受
    dont:
      - 过度正式
      - 使用生僻词
      - 虚假宣传
      - 过度营销

  emotional:
    tone: "温暖、感人、有温度"
    language_level: "文学性、有意境"
    sentence_structure: "灵活多变，富有韵律"
    vocabulary: "精选词汇，有意象"
    do:
      - 讲述故事
      - 细节刻画
      - 触发共鸣
      - 表现人文关怀
    dont:
      - 过度夸张
      - 虚假故事
      - 廉价煽情
      - 不符合品牌

  creative:
    tone: "新颖、独特、吸睛"
    language_level: "非传统、有创意"
    sentence_structure: "打破常规"
    vocabulary: "创意搭配，意外组合"
    do:
      - 使用比喻拟人
      - 反常规思维
      - 制造悬念
      - 创意意象
    dont:
      - 过度晦涩
      - 无法理解
      - 偏离主题
      - 忽视产品特性


# ==================== 质量标准 ====================

quality_standards:
  product_copy:
    content_quality:
      - 文案自然流畅，无生硬拼接
      - 卖点表述清晰有力
      - 文化融合自然适当
      - 目标受众明确体现
    language_quality:
      - 无语法错误
      - 无表意不清
      - 措辞准确
      - 适合目标受众
    completeness:
      - 包含所有关键信息
      - 逻辑完整
      - 有清晰的结构
      - 有清晰的结论

  slogan:
    memorability: "朗朗上口，易于记忆"
    differentiation: "区别于竞品，有独特性"
    cultural_integration: "自然融入文化元素"
    emotional_resonance: "能触发目标情感"
    technical_excellence: "字数控制、节奏感"

  social_media:
    authenticity: "真实感强，非虚假宣传"
    engagement: "高互动潜力"
    platform_fit: "符合平台特性"
    value_delivery: "为用户提供价值"
    shareability: "易于分享和传播"


# ==================== 优化建议 ====================

optimization_tips:
  cultural_integration:
    dos:
      - "自然融入，不生硬堆砌"
      - "根据语境选择合适的文化元素"
      - "把文化元素作为比喻和背景"
      - "强调文化与产品的内在联系"
    donts:
      - "不要过度强调文化标签"
      - "不要使用不准确的文化表述"
      - "不要让文化喧宾夺主"
      - "不要刻板地套用文化元素"

  target_audience_positioning:
    dos:
      - "深入理解受众的真实需求"
      - "用受众熟悉的语言和场景"
      - "触及受众的痛点和渴望"
      - "体现受众能获得的真实价值"
    donts:
      - "不要假设所有人需求一样"
      - "不要用受众不理解的表述"
      - "不要忽视受众的实际需求"

  quality_control:
    dos:
      - "多个角度检查内容"
      - "测试内容的吸引力和说服力"
      - "收集反馈并持续优化"
      - "建立内容评审机制"
    donts:
      - "不要跳过审核流程"
      - "不要忽视小的表达问题"
      - "不要一成不变地使用模板"
