# Logstash Pipeline配置

input {
  beats {
    port => 5044
  }
}

filter {
  # 解析JSON格式日志
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # 解析时间戳
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 添加自定义字段
  mutate {
    add_field => { "[@metadata][index_prefix]" => "ai-platform" }
  }

  # 解析日志级别
  grok {
    match => { "message" => "%{LOGLEVEL:log_level}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # 调试输出
  stdout {
    codec => rubydebug
  }
}
