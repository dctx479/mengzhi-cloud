# Alembic Configuration File
# Database migration configuration file
#
# Version: 1.0
# Updated: 2026-01-17

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s_%%(ts)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "create_date" timestamp (leave blank for localtime)
# string value is passed to a datetime.datetime constructor.
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field of the migration file
# (defaults to 40)
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# set to 'true' to template things like decimal.Decimal with an
# asstring of Decimal("0.1")
# rather than just getting Decimal("0.1")
# sqlalchemy_string_representation = legacy

# prog name to use for the command line
# if this is the case, verify that the value you supply is valid
# (try this first if --version errors out)
# prog = alembic

# use the relative downgrade target scheme.
# this allows down revision file annotation (used by downgrade --sql)
# to be relative to the latest sources head, regardless the current migration context.
# use_rel_downgrade = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# the output encoding used when revision files
# write migration SQL scripts to the console
sqlalchemy.url =

[sqlalchemy]
# Database connection URL
# Read from environment variables, format: mysql+pymysql://user:password@host:port/database?charset=utf8mb4
# Default uses local MySQL
sqlalchemy.url = mysql+pymysql://root:root123@localhost:3306/agri_platform?charset=utf8mb4

# If empty, use environment variables
# sqlalchemy.url = driver://user:pass@localhost/dbname
