version: '3.8'

services:
  # 测试数据库
  test-mysql:
    image: mysql:8.0
    container_name: ai-platform-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test_root_pass
      MYSQL_DATABASE: ai_platform_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest_root_pass"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test-network

  # 测试Redis
  test-redis:
    image: redis:7-alpine
    container_name: ai-platform-test-redis
    command: redis-server --requirepass testredispass
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test-network

  # 测试运行器
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: ai-platform-test-runner
    environment:
      # 测试数据库配置
      DATABASE_URL: mysql+pymysql://testuser:testpass@test-mysql:3306/ai_platform_test?charset=utf8mb4
      MYSQL_HOST: test-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: ai_platform_test

      # 测试Redis配置
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: testredispass
      REDIS_DB: 0

      # JWT配置
      SECRET_KEY: test-secret-key-for-testing-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # 应用配置
      ENVIRONMENT: test
      DEBUG: "false"
      LOG_LEVEL: WARNING

      # DeepSeek API配置（测试环境使用Mock）
      DEEPSEEK_API_KEY: test-api-key
      OPENAI_API_KEY: test-api-key
    volumes:
      - ./:/app
      - ./coverage_html:/app/coverage_html
    depends_on:
      test-mysql:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '等待数据库完全就绪...' &&
        sleep 5 &&
        echo '开始运行测试...' &&
        pytest tests/ -v --cov=app --cov-report=html --cov-report=term-missing --cov-report=xml &&
        echo '测试完成！覆盖率报告已生成到 coverage_html/ 目录'
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
