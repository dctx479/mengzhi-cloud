# =============================================================================
# 系统健康检查配置文件
# 请根据实际环境修改以下配置
# =============================================================================

# 检查配置
CHECK_INTERVAL=60
MAX_RETRIES=3
TIMEOUT=10

# 服务配置
SERVICES_TO_CHECK="docker mysql redis nginx"
DOCKER_CONTAINERS="agri-backend agri-frontend agri-mysql agri-redis"

# 数据库配置
DB_HOST=localhost
DB_PORT=3307
DB_USER=agri_user
DB_PASSWORD=agri_pass
DB_NAME=agri_platform

# Redis配置
REDIS_HOST=localhost
REDIS_PORT=6380
REDIS_PASSWORD=

# 磁盘空间检查
DISK_USAGE_THRESHOLD=80
DISK_PATHS_TO_CHECK="/ /var /opt /home"

# 内存使用检查
MEMORY_USAGE_THRESHOLD=85

# CPU使用检查
CPU_USAGE_THRESHOLD=90

# 网络检查
NETWORK_HOSTS_TO_CHECK="8.8.8.8 114.114.114.114 www.baidu.com"
API_ENDPOINTS_TO_CHECK="http://localhost:5000/health http://localhost:5173"

# 日志配置
LOG_DIR=/var/log/health-check
LOG_LEVEL=INFO

# 通知配置
NOTIFICATION_ENABLED=false
WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=your_token
EMAIL_ENABLED=false
EMAIL_TO=admin@example.com

# 高级配置
ENABLE_PERFORMANCE_METRICS=true
ENABLE_LOG_ANALYSIS=true
ALERT_COOLDOWN_MINUTES=30