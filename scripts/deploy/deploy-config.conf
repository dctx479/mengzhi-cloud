# =============================================================================
# 自动化部署配置文件
# 请根据实际环境修改以下配置
# =============================================================================

# 项目配置
PROJECT_DIR=/opt/agri-platform
GIT_REPO=https://github.com/your-org/agri-platform.git
GIT_BRANCH=main
BACKUP_DIR=/opt/backups/deployments

# 服务配置
DOCKER_COMPOSE_FILE=docker-compose.yml
SERVICES_TO_RESTART="backend frontend"

# 数据库配置
DB_HOST=localhost
DB_PORT=3307
DB_USER=agri_user
DB_PASSWORD=agri_pass
DB_NAME=agri_platform

# 部署配置
ENABLE_BACKUP=true
ENABLE_MIGRATION=true
ENABLE_TESTS=false
ROLLBACK_ON_FAILURE=true
HEALTH_CHECK_TIMEOUT=300

# 通知配置
NOTIFICATION_ENABLED=false
WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=your_token
EMAIL_ENABLED=false
EMAIL_TO=admin@example.com

# 日志配置
LOG_DIR=/var/log/deploy
LOG_LEVEL=INFO

# 高级配置
PARALLEL_DEPLOYMENT=false
BLUE_GREEN_DEPLOYMENT=false
CANARY_DEPLOYMENT=false
DEPLOYMENT_STRATEGY=rolling

# 环境特定配置
# 开发环境
DEV_GIT_BRANCH=develop
DEV_ENABLE_TESTS=true
DEV_HEALTH_CHECK_TIMEOUT=120

# 预生产环境
STAGING_GIT_BRANCH=main
STAGING_ENABLE_TESTS=true
STAGING_HEALTH_CHECK_TIMEOUT=180

# 生产环境
PROD_GIT_BRANCH=main
PROD_ENABLE_TESTS=false
PROD_HEALTH_CHECK_TIMEOUT=300
PROD_BLUE_GREEN_DEPLOYMENT=true