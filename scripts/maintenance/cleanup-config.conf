# =============================================================================
# 日志清理配置文件
# 请根据实际环境修改以下配置
# =============================================================================

# 保留策略
LOG_RETENTION_DAYS=30
ARCHIVE_RETENTION_DAYS=90
COMPRESS_LOGS=true
DELETE_EMPTY_DIRS=true

# 日志路径配置
LOG_PATHS="/var/log /opt/agri-platform/backend/logs /opt/agri-platform/logs"
SYSTEM_LOG_PATHS="/var/log/syslog /var/log/messages /var/log/auth.log"
APPLICATION_LOG_PATHS="/opt/agri-platform/backend/logs /opt/agri-platform/logs"

# 排除配置
EXCLUDE_PATTERNS="*.pid *.lock current active"
EXCLUDE_EXTENSIONS="pid lock tmp"

# 压缩配置
COMPRESSION_TYPE=gzip
COMPRESSION_LEVEL=6

# 通知配置
NOTIFICATION_ENABLED=false
WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=your_token
EMAIL_ENABLED=false
EMAIL_TO=admin@example.com

# 日志配置
CLEANUP_LOG_DIR=/var/log/cleanup
LOG_LEVEL=INFO

# 高级配置
ENABLE_SYSTEM_LOG_CLEANUP=true
ENABLE_DOCKER_LOG_CLEANUP=true
ENABLE_NGINX_LOG_CLEANUP=true
ENABLE_DATABASE_LOG_CLEANUP=true

# 特定服务配置
NGINX_LOG_RETENTION_DAYS=30
DOCKER_LOG_MAX_SIZE=50MB
MYSQL_LOG_RETENTION_DAYS=7
REDIS_LOG_RETENTION_DAYS=7

# 安全配置
BACKUP_BEFORE_DELETE=false
BACKUP_DIRECTORY=/opt/backups/logs
MAX_PARALLEL_OPERATIONS=5