services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agri_platform
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: agri-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agri-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://root:root123@mysql:3306/agri_platform
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-please-change-in-production-env-32chars
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - JD_APP_KEY=${JD_APP_KEY:-}
      - JD_SECRET_KEY=${JD_SECRET_KEY:-}
      - JD_ACCESS_TOKEN=${JD_ACCESS_TOKEN:-}
      - JD_OAUTH_REDIRECT_URI=${JD_OAUTH_REDIRECT_URI:-}
      - TAOBAO_APP_KEY=${TAOBAO_APP_KEY:-}
      - TAOBAO_APP_SECRET=${TAOBAO_APP_SECRET:-}
      - TAOBAO_SESSION=${TAOBAO_SESSION:-}
      - TAOBAO_ADZONE_ID=${TAOBAO_ADZONE_ID:-}
      - TAOBAO_OAUTH_REDIRECT_URI=${TAOBAO_OAUTH_REDIRECT_URI:-}
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agri-network
    command: >
      sh -c "
        echo 'Starting backend...' &&
        sleep 10 &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: agri-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - agri-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local

networks:
  agri-network:
    driver: bridge
