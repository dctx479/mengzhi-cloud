name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # 前端测试
  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting
      working-directory: ./frontend
      run: npm run lint

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test

    - name: Run frontend test coverage
      working-directory: ./frontend
      run: npm run test:coverage

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  # 后端测试
  backend-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: agri_platform_test
          MYSQL_USER: agri_user
          MYSQL_PASSWORD: agri_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h"127.0.0.1" --silent; do
          sleep 1
        done

    - name: Run database migrations
      working-directory: ./backend
      env:
        DATABASE_URL: mysql+pymysql://agri_user:agri_pass@localhost:3306/agri_platform_test
        REDIS_URL: redis://localhost:6379/0
        ENCRYPTION_KEY: test-key-for-ci
      run: |
        alembic upgrade head

    - name: Run backend tests
      working-directory: ./backend
      env:
        DATABASE_URL: mysql+pymysql://agri_user:agri_pass@localhost:3306/agri_platform_test
        REDIS_URL: redis://localhost:6379/0
        ENCRYPTION_KEY: test-key-for-ci
        ENVIRONMENT: test
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html tests/

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy bandit safety

    - name: Run Black (code formatting)
      working-directory: ./backend
      run: black --check --diff .

    - name: Run isort (import sorting)
      working-directory: ./backend
      run: isort --check-only --diff .

    - name: Run flake8 (linting)
      working-directory: ./backend
      run: flake8 .

    - name: Run mypy (type checking)
      working-directory: ./backend
      run: mypy app/

    - name: Run bandit (security linting)
      working-directory: ./backend
      run: bandit -r app/ -f json -o bandit-report.json

    - name: Run safety (dependency security check)
      working-directory: ./backend
      run: safety check --json --output safety-report.json

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          backend/safety-report.json
        retention-days: 30

  # Docker 构建测试
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: agri-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: agri-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose
      run: |
        # 创建测试环境变量文件
        echo "ENCRYPTION_KEY=test-key-for-ci" > .env

        # 启动服务
        docker-compose -f docker-compose.yml up -d

        # 等待服务启动
        sleep 30

        # 检查服务健康状态
        docker-compose ps

        # 测试后端API
        curl -f http://localhost:5000/health || exit 1

        # 测试前端
        curl -f http://localhost:5173 || exit 1

        # 清理
        docker-compose down -v

  # 集成测试
  integration-test:
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install test dependencies
      run: |
        npm install -g newman
        pip install requests pytest

    - name: Start application
      run: |
        echo "ENCRYPTION_KEY=test-key-for-ci" > .env
        docker-compose up -d
        sleep 60

    - name: Run API integration tests
      working-directory: ./tests
      run: |
        # 运行 Postman 集合测试（如果存在）
        if [ -f "api-tests.postman_collection.json" ]; then
          newman run api-tests.postman_collection.json \
            --environment api-tests.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-results.json
        fi

        # 运行 Python 集成测试
        if [ -f "test_integration.py" ]; then
          pytest test_integration.py -v
        fi

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          tests/newman-results.json
          tests/pytest-results.xml
        retention-days: 7

    - name: Cleanup
      if: always()
      run: docker-compose down -v

  # 性能测试
  performance-test:
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Start application
      run: |
        echo "ENCRYPTION_KEY=test-key-for-ci" > .env
        docker-compose up -d
        sleep 60

    - name: Run performance tests
      working-directory: ./tests
      run: |
        if [ -f "performance-test.js" ]; then
          k6 run --out json=performance-results.json performance-test.js
        fi

    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: tests/performance-results.json
        retention-days: 30

    - name: Cleanup
      if: always()
      run: docker-compose down -v

  # 通知
  notify:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, code-quality, docker-build, integration-test]
    if: always()

    steps:
    - name: Notify on success
      if: ${{ needs.frontend-test.result == 'success' && needs.backend-test.result == 'success' && needs.code-quality.result == 'success' && needs.docker-build.result == 'success' && needs.integration-test.result == 'success' }}
      run: |
        echo "✅ All CI checks passed successfully!"

    - name: Notify on failure
      if: ${{ needs.frontend-test.result == 'failure' || needs.backend-test.result == 'failure' || needs.code-quality.result == 'failure' || needs.docker-build.result == 'failure' || needs.integration-test.result == 'failure' }}
      run: |
        echo "❌ CI checks failed. Please check the logs."
        exit 1